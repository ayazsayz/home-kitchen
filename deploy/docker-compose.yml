# Home Kitchen — self-hosted install (APP_MODE=docker or offline).
# Supabase (database, logins, live updates, photos) runs from the official files in ./supabase, unchanged.
# Start:  docker compose -f deploy/docker-compose.yml up -d --build      (install.ps1 / install.sh do this for you)
# All settings live in deploy/.env (made by scripts/setup.mjs).
name: home-kitchen

include:
  - path:
      - ./supabase/docker-compose.yml
      - ./supabase-overrides.yml
    env_file: ./.env

x-app-env: &app-env
  APP_MODE: ${APP_MODE:-offline}
  FEATURE_CUSTOMER_SITE: ${FEATURE_CUSTOMER_SITE:-}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
  SUPABASE_INTERNAL_URL: http://kong:8000
  SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
  CRON_SECRET: ${CRON_SECRET}
  TZ: ${SHOP_TIMEZONE:-Asia/Karachi}
  POSTGRES_HOST: ${POSTGRES_HOST:-db}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_DB: ${POSTGRES_DB:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  # optional internet features (leave empty when offline)
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-}
  ZIINA_API_KEY: ${ZIINA_API_KEY:-}
  ZIINA_TEST_MODE: ${ZIINA_TEST_MODE:-true}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  SUMMARY_FROM: ${SUMMARY_FROM:-}

services:
  # One-off: creates/updates the Home Kitchen tables (every supabase/*.sql once, in order).
  migrate:
    container_name: hk-migrate
    image: home-kitchen-app
    build:
      context: ..
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${HK_PUBLIC_SUPABASE_URL:-:8000}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    environment: *app-env
    command: ["sh", "/app/deploy/scripts/migrate.sh"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy

  # The kitchen app (staff screens, and the customer website unless APP_MODE=offline).
  app:
    container_name: hk-app
    image: home-kitchen-app
    pull_policy: never # built by the migrate service above
    restart: unless-stopped
    environment: *app-env
    ports:
      - ${APP_PORT:-3000}:3000
    depends_on:
      migrate:
        condition: service_completed_successfully
      api-gw:
        condition: service_started

  # Daily jobs: summary (email when internet + key are set) and backups to BACKUP_DIR.
  scheduler:
    container_name: hk-scheduler
    image: home-kitchen-app
    pull_policy: never
    restart: unless-stopped
    environment:
      <<: *app-env
      APP_URL: http://app:3000
      SUMMARY_TIME: ${SUMMARY_TIME:-07:00}
      BACKUP_TIME: ${BACKUP_TIME:-07:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    command: ["node", "/app/deploy/scripts/scheduler.mjs"]
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./supabase/volumes/storage:/storage
    depends_on:
      app:
        condition: service_started
